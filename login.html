<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Cargo Connect</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/auth.css">

</head>

<body>

<div class="container">

  <div class="left">

    <h1>Welcome Back</h1>

    <p>

      Login to continue booking vehicles,
      tracking shipments and managing deliveries.

    </p>

    <img src="https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=900&q=80">

  </div>

  <div class="right">

    <form id="loginForm">

      <h2>Login</h2>

      <div class="input-box">

        <i class="fa fa-envelope"></i>

        <input
                type="email"
                id="email"
                placeholder="Email"
                required>

      </div>

      <div class="input-box">

        <i class="fa fa-lock"></i>

        <input
                type="password"
                id="password"
                placeholder="Password"
                required>

        <span id="togglePassword">

<i class="fa fa-eye"></i>

</span>

      </div>

      <div class="remember">

        <label>

          <input type="checkbox">

          Remember Me

        </label>

        <a href="#">Forgot Password?</a>

      </div>

      <button>

        Login

      </button>

      <p>

        Don't have account?

        <a href="register.html">

          Register

        </a>

      </p>

    </form>

  </div>

</div>

<script src="js/login.js"></script>

</body>

</html>
